
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: dam-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: chainguard/minio:latest
    container_name: dam-minio
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_test_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: dam-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    image: dam-backend:local
    container_name: dam-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dam
      DB_USER: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      FRONTEND_URL: http://localhost:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - rabbitmq
      - minio
      - redis

      
  worker:
    image: dam-worker:local
    container_name: dam-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      BACKEND_URL: http://backend:3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    depends_on:
      - rabbitmq
      - minio
      - backend

  frontend:
    image: dam-frontend:local
    container_name: dam-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  rabbitmq_data:
  minio_test_data:
  redis_data:
